services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: isolated-test-only
      MARIADB_ROOT_PASSWORD: isolated-root-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 1s
      timeout: 5s
      retries: 60
    tmpfs:
      - /var/lib/mysql
  wp:
    image: wordpress:6.9.4-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: isolated-test-only
      WORDPRESS_DB_NAME: wordpress
      FTW_DOWNLOAD_TEST_PORT: ${FTW_DOWNLOAD_TEST_PORT:-18030}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('FS_METHOD', 'direct');
    ports:
      - '127.0.0.1:${FTW_DOWNLOAD_TEST_PORT:-18030}:80'
    volumes:
      - ${FTW_DOWNLOAD_TEST_ZIP:?Set FTW_DOWNLOAD_TEST_ZIP to an absolute release ZIP path}:/ftw-release.zip:ro
      - ./fixture.php:/var/www/html/wp-content/mu-plugins/ftw-download-test.php:ro
      - .:/ftw-tests:ro
